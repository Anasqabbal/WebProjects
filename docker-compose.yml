services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=5000
      - GAME_PATH=/usr/local/bin/game
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "if [ ! -d node_modules/express ]; then npm install; fi && npm start"
    networks:
      - game_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8000:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "if [ ! -d node_modules ]; then npm install; fi && npm run dev -- --host"
    depends_on:
      - backend
    networks:
      - game_network

volumes:
  backend_node_modules:
  frontend_node_modules:

networks:
  game_network:
    name: game_of_life_network
